name: Sprint 9 - Joel y Zahid
on:
  push:
    branches: [sprint-9-zahid, fix/sprint9-joel-zahid]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/clinica-web-react/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/api_hospital/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove previous execution evidence
        run: python -c "from pathlib import Path; [p.unlink() for p in Path('evidence/sprint-9-joel-zahid').glob('*.xml')]"
      - run: npm ci
        working-directory: frontend/clinica-web-react
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
        working-directory: backend/api_hospital
      - name: Validate translations, lint and production build
        working-directory: frontend/clinica-web-react
        run: |
          npm run check:i18n
          npm run lint
          npm run build
          npm run check:bundle
      - name: Frontend regression evidence
        id: frontend
        continue-on-error: true
        working-directory: frontend/clinica-web-react
        run: npm test -- --reporter=default --reporter=junit --outputFile=../../evidence/sprint-9-joel-zahid/frontend.xml
      - name: API regression evidence
        id: backend
        continue-on-error: true
        working-directory: backend/api_hospital
        env:
          RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: python -m pytest -q --junitxml=../../evidence/sprint-9-joel-zahid/backend.xml
      - name: Generate traceability report
        if: always() && steps.frontend.outcome != 'skipped' && steps.backend.outcome != 'skipped'
        run: python scripts/traceability.py --junit evidence/sprint-9-joel-zahid/frontend.xml evidence/sprint-9-joel-zahid/backend.xml
      - name: Require technical evidence for Joel and Zahid
        run: python scripts/traceability.py --junit evidence/sprint-9-joel-zahid/frontend.xml evidence/sprint-9-joel-zahid/backend.xml --story PBL-06 --story PBL-09 --story PBL-11 --story PBL-16 --story PBL-25 --story PBL-38 --output evidence/sprint-9-joel-zahid/alcance-tecnico --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-9-zahid-evidence
          path: evidence/sprint-9-joel-zahid/
      - name: Enforce technical results
        if: always() && (steps.frontend.outcome != 'success' || steps.backend.outcome != 'success')
        run: exit 1
