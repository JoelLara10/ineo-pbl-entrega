name: INEO API CI

on:
  push:
    branches:
      - main
      - "sprint-*/**"
      - "sprints/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-api:
    name: Validate Flask API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/api_hospital

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api_hospital/requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run API tests
        env:
          MONGO_URI: mongodb://localhost:27017/
          MONGO_DB: hospital_test
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret-key
        run: python -m pytest -v --cov=. --cov-report=term-missing --junitxml=test-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-tests
          path: backend/api_hospital/test-results.xml

  spark-runtime:
    name: Real Spark integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api_hospital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/api_hospital/requirements*.txt'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements.txt -r requirements-test.txt -r requirements-spark.txt
      - name: Execute real engine with synthetic data
        env:
          RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: python -m pytest tests/test_spark_engine.py -v --junitxml=spark-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-runtime-tests
          path: backend/api_hospital/spark-results.xml
