name: INEO API CI

on:
  push:
    branches:
      - main
      - "sprint-*/**"
      - "sprints/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-api:
    name: Validate Flask API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/api_hospital

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api_hospital/requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run API tests
        env:
          MONGO_URI: mongodb://localhost:27017/
          MONGO_DB: hospital_test
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret-key
        run: python -m pytest -v --cov=. --cov-report=term-missing
