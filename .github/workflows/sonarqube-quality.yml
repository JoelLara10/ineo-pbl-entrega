
name: INEO SonarQube Quality - API

on:
  push:
    branches:
      - "feature/sprint-10-jaime"
      - "feature/**"
      - develop
      - qa
      - main

  pull_request:
    branches:
      - develop
      - qa
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar-api:
    name: SonarQube - API + Coverage + Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api_hospital/requirements*.txt

      - name: Install API and test dependencies
        working-directory: backend/api_hospital
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Run API tests and generate coverage XML
        working-directory: backend/api_hospital
        env:
          MONGO_URI: mongodb://localhost:27017/
          MONGO_DB: hospital_test
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret-key
        run: |
          python -m pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Verify API coverage XML
        working-directory: backend/api_hospital
        run: |
          test -s coverage.xml
          echo "Coverage XML generated successfully"
          ls -lh coverage.xml

      - name: Upload API coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-api-coverage
          path: |
            backend/api_hospital/coverage.xml
            backend/api_hospital/test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze API and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend/api_hospital
          args: >
            -Dsonar.organization=jaimediaz25
            -Dsonar.projectKey=jaimediaz25
            -Dsonar.projectName=api_hospital
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/tests/**,**/coverage.xml
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=testing/contract_server.py
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  sonar-required:
    name: SonarQube required check - API
    runs-on: ubuntu-latest
    needs:
      - sonar-api
    if: always()

    steps:
      - name: Verify API analysis and Quality Gate
        env:
          API_RESULT: ${{ needs.sonar-api.result }}
        run: |
          echo "API analysis result: ${API_RESULT}"

          if [ "${API_RESULT}" != "success" ]; then
            echo "ERROR: API analysis or Quality Gate failed."
            exit 1
          fi

          echo "SUCCESS: API analysis and Quality Gate passed."
