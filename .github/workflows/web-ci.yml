name: INEO Web CI

on:
  push:
    branches:
      - main
      - "sprint-*"
  pull_request:
    branches:
      - main

jobs:
  validate-web:
    name: Validate React Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/clinica-web-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/clinica-web-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build