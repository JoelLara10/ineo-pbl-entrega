name: INEO Web CI

on:
  push:
    branches:
      - main
      - qa
      - develop
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "sprint-*"
      - "sprints/**"
  pull_request:
    branches:
      - main
      - qa
      - develop

jobs:
  validate-web:
    name: Validate React Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/clinica-web-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/clinica-web-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run check:i18n

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production application
        env:
          VITE_API_URL: http://localhost:5001/api/v1
        run: npm run build
